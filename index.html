<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION TRUST // OFFICIAL SPLASH SCREEN</title>
    <!-- IMPORTĂM OFICIAL MONTSERRAT ȘI INTER DIN TEXTUL PUR GOOGLE FONTS -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #040d21; /* Albastru cosmic intens reîncărcat */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* CONTAINER 100% FLUID PENTRU TELEFOANE SMART - COMPATIBILITATE MAXIMĂ */
        .orion-splash-container {
            width: 100vw;
            height: 100vh;
            max-width: 440px;
            /* Gradient complex ce redă reflexia de adâncime a cristalelor cosmice */
            background: radial-gradient(circle at 80% 20%, #0d2552 0%, #06132d 40%, #030814 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 30px;
            position: relative;
            /* ANIMAȚIA GENERALĂ AUTOMATĂ DE FADE-OUT LA SECUNDA 3.5 */
            animation: globalFadeOut 0.8s ease-in-out 3.5s forwards;
        }

        /* TEXTURĂ DISCRETĂ PENTRU REFLEXIILE DE GHEAȚĂ DIGITALĂ */
        .crystal-reflection-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* CONTAINERUL LOGO-ULUI CENTRAL - AMPRENTA REALA DE 3CM ȘI ORBITA */
        .logo-system-wrapper {
            width: 240px; /* Dimensiune optimă pentru amprenta impunătoare de 3cm */
            height: 240px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 70px;
            z-index: 2;
        }

        /* REGLAJ DETALIU: CONTUR ALB DISCRET (STROKE FIN CU FADE) */
        .orion-stroke-orbit {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 255, 255, 0.22); /* Stroke fin alb cu opacitate redusă */
            border-radius: 50%;
            pointer-events: none;
            z-index: 2;
        }

        /* REGLAJ DETALIU: LUMINIȚA CE FACE UN TUR COMPLET ÎN 3.5 SECUNDE (TRASOR) */
        .light-orbit-tracer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: tracerOrbit 3.5s linear infinite;
        }

        /* Punctul luminos intens neon cyan de pe orbită */
        .light-orbit-tracer::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: #0ea5e9;
            border-radius: 50%;
            box-shadow: 0 0 16px #0ea5e9, 0 0 6px #ffffff;
        }

        /* GRAFICA DIRECTĂ A AMPRENTEI (INLINE VECTORIAL - AFISARE GARANTATA 100%) */
        .fingerprint-vector-core {
            width: 70%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* GLOWING DISCRET EXCLUSIV PE LINIILE AMPRENTEI */
            filter: drop-shadow(0 0 16px rgba(14, 165, 233, 0.85));
            position: relative;
            z-index: 4;
        }

        .fingerprint-vector-core svg {
            width: 100%;
            height: 100%;
        }

        /* LINIILE ȘI STELELE CONSTELAȚIEI ORION INTERCONECTATE REAL */
        .constellation-stars-system {
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            z-index: 5;
            pointer-events: none;
        }

        /* Liniile vectoriale fine dintre stelele aurii */
        .constellation-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: rgba(245, 158, 11, 0.35);
            stroke-width: 1;
            stroke-dasharray: 2;
        }

        .orion-golden-star {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
            /* Respirația cosmică lentă stabilită */
            animation: cosmicBreathAnimation 2.8s ease-in-out infinite alternate;
        }

        /* TYPOGRAPHY INTEGRAL ÎN LIMBA ENGLEZĂ (ALB MAT, MARIT, FĂRĂ GLOW) */
        .orion-typography-section {
            text-align: center;
            width: 100%;
            z-index: 6;
        }

        /* CORECTURĂ PROPORȚII TEXT: ORION TRUST (MONTSERRAT, MAJUSCULE, MARE, AERISIT) */
        .orion-brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 34px; /* Mărit substanțial pentru vizibilitate de elită */
            font-weight: 800;
            color: #ffffff; /* Alb mat curat */
            margin: 0 0 14px 0;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        /* CORECTURĂ PROPORȚII TEXT: SUBTITLUL (INTER, CLAR, ULTRA-LIZIBIL) */
        .orion-brand-subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 14px; /* Mărit pentru a elimina aspectul liliputan */
            font-weight: 400;
            color: #d1d5db; /* Alb mat secundar */
            margin: 0;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            line-height: 1.6;
        }

        /* TIMING-UL JOCULUI DE LUMINĂ PENTRU STELE (RESPIRAȚIE LENTĂ) */
        @keyframes cosmicBreathAnimation {
            0% {
                transform: scale(0.8);
                opacity: 0.4;
                box-shadow: 0 0 6px #f59e0b;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
                box-shadow: 0 0 16px #f59e0b, 0 0 6px #ffffff;
            }
        }

        /* TIMING-UL TRASORULUI: EXACT UN TUR COMPLET ÎN 3.5 SECUNDE */
        @keyframes tracerOrbit {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* TIMING-UL OBLIGATORIU PENTRU FADE-OUT GENERAL */
        @keyframes globalFadeOut {
            0% {
                opacity: 1;
                visibility: visible;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>

    <div class="orion-splash-container">
        <div class="crystal-reflection-overlay"></div>
        
        <!-- WRAPPER LOGO: AMPRENTĂ RECONSTRUITĂ, STROKE, GLOW ȘI TRASOR -->
        <div class="logo-system-wrapper">
            <!-- Cercul fin alb cu fade -->
            <div class="orion-stroke-orbit"></div>
            
            <!-- Trasorul luminos cu mișcare de 3.5 secunde -->
            <div class="light-orbit-tracer"></div>
            
            <!-- Amprenta reală redată vectorial (Garanție de afișare) -->
            <div class="fingerprint-vector-core">
                <svg viewBox="0 0 100 100" fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-linecap="round">
                    <path d="M50,15 C32,15 20,28 20,45 C20,48 21,52 22,55" />
                    <path d="M50,5 C25,5 10,22 10,45 C10,55 14,65 20,72" />
                    <path d="M50,25 C38,25 30,33 30,45 C30,52 34,58 40,62" />
                    <path d="M50,35 C44,35 40,39 40,45 C40,47 42,50 45,52" />
                    <path d="M50,5 L50,95" stroke-dasharray="1 3" />
                    <path d="M55,45 C55,39 51,35 50,35" />
                    <path d="M60,45 C60,33 52,25 50,25" />
                    <path d="M70,45 C70,22 55,5 50,5" />
                    <path d="M80,45 C80,15 65,0 50,0" />
                    <path d="M45,52 C48,54 50,55 53,55 C58,55 60,51 60,45" />
                    <path d="M40,62 C45,66 55,66 60,62 C67,58 70,52 70,45" />
                    <path d="M30,72 C40,80 60,80 70,72 C77,65 80,55 80,45" />
                </svg>
            </div>
            
            <!-- Liniile fine și stelele aurii ale constelației Orion -->
            <div class="constellation-stars-system">
                <svg class="constellation-lines" viewBox="0 0 100 100">
                    <line x1="50" y1="20" x2="35" y2="40" />
                    <line x1="50" y1="20" x2="65" y2="40" />
                    <line x1="35" y1="40" x2="50" y2="55" />
                    <line x1="65" y1="40" x2="50" y2="55" />
                    <line x1="50" y1="55" x2="40" y2="75" />
                    <line x1="50" y1="55" x2="60" y2="75" />
                </svg>
                <div class="orion-golden-star" style="top: 20%; left: 50%; animation-delay: 0s;"></div>
                <div class="orion-golden-star" style="top: 40%; left: 35%; animation-delay: 0.4s;"></div>
                <div class="orion-golden-star" style="top: 40%; left: 65%; animation-delay: 0.2s;"></div>
                <div class="orion-golden-star" style="top: 55%; left: 50%; animation-delay: 0.6s;"></div>
                <div class="orion-golden-star" style="top: 75%; left: 40%; animation-delay: 0.1s;"></div>
                <div class="orion-golden-star" style="top: 75%; left: 60%; animation-delay: 0.3s;"></div>
            </div>
        </div>

        <!-- TYPOGRAPHY CORECTATĂ: ALB MAT, MARE, LIZIBILĂ ÎN ENGLEZĂ -->
        <div class="orion-typography-section">
            <h1 class="orion-brand-title">Orion Trust</h1>
            <p class="orion-brand-subtitle">Financial Security<br>Digital Identification</p>
        </div>
    </div>

</body>
</html>
