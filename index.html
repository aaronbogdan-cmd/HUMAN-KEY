<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMAN KEY // PREMIUM INTERFACE</title>
    <link href="googleapis.com" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .main-container {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            padding: 24px;
            box-sizing: border-box;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1f2937;
            padding: 8px 14px;
            border-radius: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 24px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            box-shadow: 0 0 8px #10b981;
        }

        .brand-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
            letter-spacing: 2px;
            margin: 0 0 6px 0;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .counter-badge {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .reward-card {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .reward-label {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .balance-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 700;
            color: #10b981;
            margin: 10px 0;
        }

        .attestation-text {
            font-size: 11px;
            color: #9ca3af;
            font-family: 'Share Tech Mono', monospace;
        }

        .action-button {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background 0.2s ease;
        }

        .action-button:hover {
            background: #1d4ed8;
        }

        .action-button.secondary {
            background: #374151;
            color: #f3f4f6;
            border: 1px solid #4b5563;
        }

        .action-button.secondary:hover {
            background: #4b5563;
        }

        .map-box {
            border: 1px solid #374151;
            border-radius: 12px;
            overflow: hidden;
            margin: 24px 0;
            height: 180px;
            background: #1f2937;
        }

        .map-element {
            width: 100%;
            height: 100%;
            border: none;
        }

        .log-container {
            margin-top: 24px;
        }

        .log-title {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #1f2937;
            font-size: 12px;
            font-family: 'Share Tech Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="status-bar">
            <div><span class="status-dot"></span>SYSTEM: ACTIVE</div>
            <div>OP_ID: 0x44B...1C6</div>
        </div>

        <div class="brand-title">HUMAN KEY</div>
        <div class="brand-subtitle">Sovereign Identity Reward Network</div>

        <div class="counter-badge">
            Sesiuni verificate astăzi global: 47,722
        </div>

        <div class="reward-card">
            <div class="reward-label">BALANȚĂ RECOMPENSĂ (USD)</div>
            <div class="balance-display">1.10</div>
            <div class="attestation-text">Hardware Enclave: Certificat</div>
        </div>

        <button class="action-button" onclick="alert('Inițiere sesiune autentificare...')">
            AUTHENTICATE SESSION
        </button>

        <button class="action-button secondary" onclick="alert('Conversie fonduri către portofel...')">
            CONVERT TO CASH
        </button>

        <div class="map-box">
            <iframe class="map-element" src="https://openstreetmap.org"></iframe>
        </div>

        <div class="log-container">
            <div class="log-title">LOGURI ACTIVITATE RECENȚI</div>
            <div class="log-item">
                <div style="color: #9ca3af;">Validare Biometrică [Titan]</div>
                <div style="color: #10b981;">+$0.02</div>
            </div>
        </div>
    </div>

</body>
</html>
